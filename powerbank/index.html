<title>Locked</title>
<style>
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0b0f;color:#f2f2f7;display:flex;justify-content:center;min-height:100vh}
 .wrap{max-width:640px;width:100%;padding:24px 16px 60px}
 h1{font-size:24px;margin:24px 0 4px}
 .sub{color:#9a9aa5;margin:0 0 20px;font-size:14px}
 .card{background:#1a1a22;border:1px solid #2c2c38;border-radius:16px;padding:18px;margin-bottom:16px}
 .card.pick{border-color:#30d158}
 .badge{display:inline-block;background:#30d158;color:#062b12;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
 .badge.alt{background:#3a3a46;color:#c9c9d4}
 h2{font-size:19px;margin:10px 0 4px}
 .price{font-size:22px;font-weight:700;color:#30d158}
 .fee{font-size:12px;color:#9a9aa5;font-weight:400}
 ul{padding-left:18px;margin:12px 0;font-size:14px;line-height:1.55;color:#d8d8e0}
 .btn{display:inline-block;background:#0a84ff;color:#fff;text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;margin-top:6px}
 .altbtn{background:#3a3a46}
 .note{background:#1c1c14;border:1px solid #4a4420;border-radius:12px;padding:14px;font-size:14px;line-height:1.6;color:#f0e6b8}
 .pimg{width:100%;max-width:280px;border-radius:12px;display:block;margin:10px 0}
 .src{font-size:12px;color:#6a6a75;margin-top:18px}
 #gate{text-align:center;margin-top:25vh}
 #gate input{padding:12px 14px;font-size:16px;border-radius:10px;border:1px solid #3a3a46;background:#1a1a22;color:#fff;width:220px;text-align:center}
 #gate button{padding:12px 20px;font-size:16px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-weight:600;margin-left:8px}
 #err{color:#ff6961;font-size:13px;margin-top:10px;display:none}
 #content{display:none}
</style>
</head>

<div class="wrap">
 <div id="gate">

async function unlock(){
  const pw=document.getElementById('pw').value;
  try{
    const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),iv=raw.slice(16,28),tag=raw.slice(28,44),data=raw.slice(44);
    const keyMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
    const full=new Uint8Array(data.length+tag.length);full.set(data);full.set(tag,data.length);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,full);
    document.getElementById('content').innerHTML=new TextDecoder().decode(plain);
    document.getElementById('gate').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(e){document.getElementById('err').style.display='block';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
