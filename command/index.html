<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>कमांड स्क्रीन</title>
<style>
:root{--gold:#ecc978;--ink:#f5f2ea;--mut:rgba(245,242,234,.62);--ok:#5fe08a;--warn:#ffc55a;--bad:#ff7a6e;--idle:rgba(245,242,234,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#05070b}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
background:
radial-gradient(520px 420px at 8% -4%,rgba(236,201,120,.34),transparent 70%),
radial-gradient(480px 460px at 104% 22%,rgba(70,120,255,.26),transparent 70%),
radial-gradient(520px 480px at -6% 62%,rgba(150,70,255,.20),transparent 70%),
radial-gradient(560px 460px at 100% 100%,rgba(236,201,120,.22),transparent 70%),
#05070b;background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 16px calc(env(safe-area-inset-bottom) + 34px)}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px 18px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.4px}
h1 span{color:var(--gold)}
.sub{font-size:13px;color:var(--mut);margin-top:4px}
.clock{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mut);text-align:right}
.glass{position:relative;border-radius:30px;padding:20px;
background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
box-shadow:0 18px 40px rgba(0,0,0,.22)}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 38%)}
.row{display:flex;align-items:center;justify-content:space-between;position:relative}
.ttl{font-size:13px;font-weight:600;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.ok .dot,.pill.ok .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.warn .dot,.pill.warn .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.bad .dot,.pill.bad .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.rates{margin-top:14px;position:relative}
.r{display:flex;align-items:baseline;justify-content:space-between;padding:15px 0}

.r b{display:block;font-size:17px;font-weight:600}
.r small{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.v{font-size:30px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--gold)}
.v i{font-style:normal;font-size:18px;font-weight:600;margin-right:2px;opacity:.85}
.foot{position:relative;margin-top:6px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:10px}
h2{margin:26px 8px 12px;font-size:13px;font-weight:600;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{padding:16px;border-radius:26px;min-height:128px;display:flex;flex-direction:column}
.t .top{display:flex;align-items:center;gap:8px;position:relative}
.t .nm{font-size:14px;font-weight:600;line-height:1.25}
.t .hl{position:relative;margin-top:12px;font-size:17px;font-weight:700;line-height:1.25}
.t .nt{position:relative;margin-top:6px;font-size:12.5px;line-height:1.35;color:var(--mut)}
.t .up{position:relative;margin-top:auto;padding-top:10px;font-size:11.5px;color:var(--idle)}
.t.wide{grid-column:1/-1;min-height:0}
.end{text-align:center;margin:26px 0 0;font-size:12px;color:var(--idle)}
.sk{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>कमांड <span>स्क्रीन</span></h1><div class="sub" id="date">&nbsp;</div></div>
<div class="clock" id="clock">--:--</div>
</header>

<section class="glass" id="rates">
<div class="row"><div class="ttl">आजचे दर · महाराष्ट्र</div><div class="pill" id="fresh"><span class="dot"></span><span id="freshTxt">तपासत आहे…</span></div></div>
<div class="rates">
<div class="r"><div><b>सोने २४ कॅरेट</b><small>१० ग्रॅम</small></div><div class="v sk" id="g24">--</div></div>
<div class="r"><div><b>सोने २२ कॅरेट</b><small>१० ग्रॅम</small></div><div class="v sk" id="g22">--</div></div>
<div class="r"><div><b>चांदी ९९९</b><small>१ किलो</small></div><div class="v sk" id="s999">--</div></div>
</div>
<div class="foot"><span>GST शिवाय · जवळच्या १०० ला</span><span id="stamp"></span></div>
</section>

<h2>स्थिती</h2>
<section class="grid" id="tiles"></section>

<p class="end">खाजगी · फक्त तुमच्यासाठी</p>
</div>
<script>
(function(){
var MR='०१२३४५६७८९';
function mr(s){return String(s).replace(/[0-9]/g,function(d){return MR[d]})}
function inr(n){return '<i>₹</i>'+Number(n).toLocaleString('en-IN')}
function r100(n){return Math.round(n/100)*100}
var MONTH=['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
var DAY=['रविवार','सोमवार','मंगळवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
function ist(d){return new Date(d.getTime()+19800000)}
function hm(d){var x=ist(d);return ('0'+x.getUTCHours()).slice(-2)+':'+('0'+x.getUTCMinutes()).slice(-2)}
function ago(ts){
  var m=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/60000));
  if(m<1)return 'आत्ताच';
  if(m<60)return mr(m)+' मिनिटांपूर्वी';
  var h=Math.floor(m/60);
  if(h<24)return mr(h)+' तासांपूर्वी';
  return mr(Math.floor(h/24))+' दिवसांपूर्वी';
}
function tick(){
  var n=ist(new Date());
  document.getElementById('clock').textContent=hm(new Date());
  document.getElementById('date').textContent=DAY[n.getUTCDay()]+', '+mr(n.getUTCDate())+' '+MONTH[n.getUTCMonth()];
  paintFresh();
}
var quoteTs=null;
function paintFresh(){
  var p=document.getElementById('fresh'),t=document.getElementById('freshTxt');
  if(!quoteTs){return}
  var m=(Date.now()-new Date(quoteTs).getTime())/60000,c,l;
  if(m<=12){c='ok';l='ताजे'}else if(m<=30){c='warn';l='थोडे जुने'}else{c='bad';l='जुने'}
  p.className='pill '+c;t.textContent=l+' · '+ago(quoteTs);
}
function loadRates(){
  fetch('/1-rates.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var ids={g24:'gold24_10g',g22:'gold22_10g',s999:'silver999_kg'};
    for(var k in ids){var el=document.getElementById(k);if(typeof d[ids[k]]==='number'){el.innerHTML=inr(r100(d[ids[k]]));el.classList.remove('sk')}}
    quoteTs=d.quote_timestamp;
    document.getElementById('stamp').textContent='अपडेट '+hm(new Date(quoteTs));
    paintFresh();
  }).catch(function(){
    quoteTs=null;var p=document.getElementById('fresh');p.className='pill bad';document.getElementById('freshTxt').textContent='दर मिळाले नाहीत';
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function loadStatus(){
  fetch('status.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var h='';
    (d.tiles||[]).forEach(function(t,i){
      var st=['ok','warn','bad'].indexOf(t.state)>=0?t.state:'';
      h+='<div class="glass t '+st+(t.wide?' wide':'')+'"><div class="top"><span class="dot"></span><span class="nm">'+esc(t.title)+'</span></div>'
        +'<div class="hl">'+esc(t.headline)+'</div>'
        +(t.note?'<div class="nt">'+esc(t.note)+'</div>':'')
        +(t.updated_at?'<div class="up">'+ago(t.updated_at)+'</div>':'')+'</div>';
    });
    document.getElementById('tiles').innerHTML=h;
  }).catch(function(){
    document.getElementById('tiles').innerHTML='<div class="glass t wide"><div class="hl">स्थिती मिळाली नाही</div></div>';
  });
}
tick();loadRates();loadStatus();
setInterval(tick,15000);setInterval(loadRates,60000);setInterval(loadStatus,300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){loadRates();loadStatus();tick()}});
})();
</script>
</body>
</html>
