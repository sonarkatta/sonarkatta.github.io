:root{font-family:Noto,system-ui,sans-serif}*{box-sizing:border-box}
html,body,#root{margin:0;background:#d5c8ae} .file-card{padding:0!important;background:transparent!important;border-radius:0!important;box-shadow:none!important;max-width:none!important}
.liquid-stage{--ink:#213039;position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse at 85% 8%,#ffffff 0%,transparent 32%),radial-gradient(ellipse at 10% 70%,#719ba7b8 0%,transparent 39%),linear-gradient(151deg,#f6e4c2 0%,#d7e5e5 20%,#b9cbd5 38%,#e1c897 60%,#b2d4cf 77%,#eddec5 100%)}
.atmosphere{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.atmosphere:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(112deg,transparent 0 35px,#fff9 47px,#bd95594d 51px,transparent 69px,transparent 165px);opacity:.35}.atmosphere i{position:absolute;border-radius:50%;filter:blur(20px)}.atmosphere i:nth-child(1){width:250px;height:220px;top:40px;right:-120px;background:#f5cf88a8}.atmosphere i:nth-child(2){width:270px;height:320px;left:-130px;top:39%;background:#76b5c1a6}.atmosphere i:nth-child(3){width:330px;height:270px;right:-130px;bottom:-50px;background:#f5dfb3c9}
.glass{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(137deg,#ffffff8a 0%,#eff8fd4c 27%,#ffffff70 47%,#f9e8c651 67%,#fff9 100%);border:1px solid #fffdfad9;backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 2px 2px #fff,inset 1px 0 1px #ffffffc7,inset 0 -2px 5px #8eaca465,0 5px 14px #405c6554,0 0 12px #ffffff72}
.glass:before{content:'';position:absolute;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 5%,#fff3 18%,#fff9 24%,transparent 37%,transparent 57%,#fffc 63%,transparent 77%);opacity:.8;transform:translateX(-12%)}.glass:after{content:'';position:absolute;inset:2px;pointer-events:none;border-radius:inherit;border-top:1px solid #fffef9b5;border-left:1px solid #ffffff67;mask-image:linear-gradient(140deg,#000,transparent 68%)}
button,a{font:inherit;cursor:pointer}.round{width:44px;height:44px;border-radius:50%;font:500 26px/1 Noto,system-ui;color:#23313b;display:grid;place-items:center}.top-controls{position:absolute;z-index:5;top:13px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.top-controls button{pointer-events:auto}.top-controls .refresh{font-size:24px}
.screen{max-width:500px;margin:auto;padding:10px 12px 16px;min-height:100dvh;display:flex;flex-direction:column;gap:8px}.mast{min-height:94px;border-radius:28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 50px;box-shadow:inset 0 2px 2px #fff,0 6px 15px #677b8342}.mast img{height:64px;max-width:90px;object-fit:contain;filter:drop-shadow(0 2px 3px #72634c55)}.mast span{font-size:9px;font-weight:700;letter-spacing:.02em}.preview-note{padding:7px 10px;border-radius:13px;text-align:center;font-size:10px;font-weight:700;color:#354b50}.rates{display:grid;grid-template-columns:1fr;gap:8px;flex:1;align-content:center}.rate{min-height:100px;border-radius:28px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;padding:8px 12px;gap:8px}.rate .bar-well{height:73px;width:72px;display:grid;place-items:center;border-radius:22px;background:radial-gradient(ellipse,#fffbbdcc 0%,#ffffff30 54%,transparent 72%);filter:drop-shadow(0 3px 4px #6b5e5066)}.bar-well img{width:72px;height:70px;object-fit:contain}.rate-label{display:flex;flex-direction:column;min-width:0;white-space:nowrap}.rate-label strong{font-size:15px;font-weight:800}.rate-label small{font-size:10px;color:#465e65}.number{font:800 19px/1.15 Noto,system-ui,sans-serif;white-space:nowrap;letter-spacing:-.04em;color:#122633;text-shadow:0 1px #fff}
.bottom{border-radius:18px;text-align:center;padding:8px 10px;display:flex;flex-direction:column;font-size:10px}.bottom small{font-size:9px;color:#455d61}.social{display:flex;gap:4px}.social a,.menu-social a{flex:1;text-align:center;text-decoration:none;color:#293c42;font-size:10px;font-weight:800;padding:9px 2px;border-radius:13px;white-space:nowrap}.copyright{text-align:center;font-size:8px;color:#3b4d52}.toast{position:fixed;z-index:20;top:63px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:20px;white-space:nowrap;font-size:11px}
.overlay{position:absolute;z-index:8;inset:0;min-height:100dvh;padding:12px 14px 22px;overflow-y:auto;background:linear-gradient(152deg,#c6d7dbc9,#e8d7b3bd 42%,#a5c8c7d4);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}.overlay-shape{position:absolute;z-index:-1;top:20%;left:-90px;width:360px;height:360px;background:radial-gradient(ellipse,#fff7c8c6,transparent 70%);filter:blur(20px)}.top-controls:has(+ .screen + .overlay){z-index:0;visibility:hidden}.overlay-head{min-height:64px;padding:10px 14px 10px 18px;border-radius:24px;display:flex;align-items:center;justify-content:space-between;font-size:23px;font-weight:800}.overlay-head .close{width:40px;height:40px;font-size:27px}.language{border-radius:28px;padding:4px 8px;margin:16px 0 12px auto;width:max-content;display:flex;align-items:center;gap:6px}.language button{border:0;background:transparent;color:#53636b;padding:4px;font-size:12px}.language button[aria-pressed=true]{color:#1a303a;font-weight:900}.menu-list{display:grid;gap:10px}.menu-item{border-radius:21px;min-height:68px;width:100%;display:flex;align-items:center;padding:10px 16px;gap:14px;text-align:left;color:#21313a}.menu-item strong{flex:1;font-size:16px}.menu-icon{color:#946735;font-size:24px}.menu-item>span:last-child{font-size:25px;color:#a77f49}.menu-social{display:flex;gap:5px;margin-top:16px}.menu-foot{display:block;text-align:center;margin-top:16px;font-size:9px}.back{border-radius:14px;padding:8px 16px;color:#233944;margin:14px 0}.section-cards{display:grid;gap:12px}.section-card{border-radius:22px;padding:20px 16px;min-height:95px;display:flex;gap:15px;align-items:center}.section-card span{font-size:24px;color:#9a7544}.section-card strong{font-size:16px;line-height:1.4}

945\u0930\u0947\u091F \u092E\u094D\u0939\u0923\u091C\u0947 \u091C\u0935\u0933\u092A\u093E\u0938 \u092A\u0942\u0930\u094D\u0923 \u0938\u094B\u0928\u0947; \u0926\u093E\u0917\u093F\u0928\u0947 \u092C\u0928\u0935\u0924\u093E\u0928\u093E \u0907\u0924\u0930 \u0927\u093E\u0924\u0942 \u092E\u093F\u0938\u0933\u0932\u0947 \u091C\u093E\u0924\u093E\u0924. 22 \u0915\u0945\u0930\u0947\u091F\u092E\u0927\u094D\u092F\u0947 24 \u092A\u0948\u0915\u0940 22 \u092D\u093E\u0917 \u0938\u094B\u0928\u0947 \u0905\u0938\u0924\u0947 (\u0938\u0941\u092E\u093E\u0930\u0947 91.6%); 18 \u0915\u0945\u0930\u0947\u091F\u092E\u0927\u094D\u092F\u0947 18 \u092D\u093E\u0917 (75%). \u0926\u093E\u0917\u093F\u0928\u094D\u092F\u093E\u0935\u0930\u0940\u0932 \u0915\u0945\u0930\u0947\u091F \u0906\u0923\u093F \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0905\u0902\u0915 \u0924\u092A\u093E\u0938\u093E. BIS\u091A\u094D\u092F\u093E \u0926\u093E\u0917\u093F\u0928\u0947 \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915\u093F\u0902\u0917 \u092F\u093E\u0926\u0940\u0924 22K916 \u0906\u0923\u093F 18K750 \u0906\u0939\u0947\u0924; 24 \u0915\u0945\u0930\u0947\u091F\u091A\u093E \u0926\u093E\u0917\u093F\u0928\u094D\u092F\u093E\u0902\u0938\u093E\u0920\u0940\u091A\u093E \u0926\u0930\u094D\u091C\u093E 24KS995 \u0905\u0938\u093E \u0928\u094B\u0902\u0926\u0935\u0932\u093E \u0906\u0939\u0947. \u092E\u094D\u0939\u0923\u0942\u0928 "24K \u092E\u094D\u0939\u0923\u091C\u0947 999 \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u0926\u093E\u0917\u093F\u0928\u093E" \u0905\u0938\u0947 \u0917\u0943\u0939\u0940\u0924 \u0927\u0930\u0942 \u0928\u0915\u093E.',en:'Carats describe the proportion of pure gold. 24-carat gold is almost entirely gold; other metals are mixed in to make jewellery. 22-carat gold has 22 parts gold out of 24 (about 91.6%); 18-carat gold has 18 parts (75%). Check the carat and fineness mark on the piece. The BIS jewellery hallmarking grades include 22K916 and 18K750; it lists the 24-carat jewellery grade as 24KS995. Do not assume that "24K" means a 999-hallmarked piece of jewellery.'}]},{title:{mr:"\u0936\u0941\u0926\u094D\u0927\u0924\u093E \u092E\u094D\u0939\u0923\u091C\u0947 \u0915\u093E\u092F?",en:"What is purity?"},body:[{mr:"\u0936\u0941\u0926\u094D\u0927\u0924\u093E \u092E\u094D\u0939\u0923\u091C\u0947 \u0935\u0938\u094D\u0924\u0942\u0924\u0940\u0932 \u0938\u094B\u0928\u0947 \u0915\u093F\u0902\u0935\u093E \u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u092A\u094D\u0930\u092E\u093E\u0923. \u0938\u094B\u0928\u094D\u092F\u093E\u0938\u093E\u0920\u0940 \u0915\u0945\u0930\u0947\u091F \u0906\u0923\u093F \u0939\u091C\u093E\u0930\u093E\u0924\u0940\u0932 \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0905\u0902\u0915 \u0935\u093E\u092A\u0930\u0924\u093E\u0924: 22K916 \u092E\u094D\u0939\u0923\u091C\u0947 \u0938\u0941\u092E\u093E\u0930\u0947 91.6% \u0938\u094B\u0928\u0947, \u0924\u0930 18K750 \u092E\u094D\u0939\u0923\u091C\u0947 75% \u0938\u094B\u0928\u0947. \u091A\u093E\u0902\u0926\u0940\u0935\u0930\u0940\u0932 999 \u092E\u094D\u0939\u0923\u091C\u0947 \u0939\u091C\u093E\u0930 \u092D\u093E\u0917\u093E\u0902\u092A\u0948\u0915\u0940 \u0915\u093F\u092E\u093E\u0928 999 \u092D\u093E\u0917 \u091A\u093E\u0902\u0926\u0940; 925 \u092E\u094D\u0939\u0923\u091C\u0947 \u0915\u093F\u092E\u093E\u0928 925 \u092D\u093E\u0917. \u0935\u0938\u094D\u0924\u0942\u0935\u0930\u0940\u0932 \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0905\u0902\u0915 \u0906\u0923\u093F \u092C\u093F\u0932\u093E\u0924\u0940\u0932 \u0928\u094B\u0902\u0926 \u091C\u0941\u0933\u0935\u093E. \u0930\u0902\u0917\u093E\u0935\u0930\u0942\u0928 \u0936\u0941\u0926\u094D\u0927\u0924\u093E \u0920\u0930\u0935\u0942 \u0928\u0915\u093E.",en:"Purity is the proportion of gold or silver in an article. Gold uses carat and a fineness number: 22K916 is about 91.6% gold, while 18K750 is 75% gold. Silver 999 means at least 999 parts silver per 1,000; 925 means at least 925 parts. Match the marked purity to the invoice. Colour alone cannot establish purity."}]},{title:{mr:"\u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u092E\u094D\u0939\u0923\u091C\u0947 \u0915\u093E\u092F?",en:"What is a hallmark?"},body:[{mr:"BIS \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u092E\u094D\u0939\u0923\u091C\u0947 \u0935\u0938\u094D\u0924\u0942\u091A\u0940 \u0936\u0941\u0926\u094D\u0927\u0924\u093E \u0924\u092A\u093E\u0938\u0942\u0928 \u0915\u0947\u0932\u0947\u0932\u0940 \u0905\u0927\u093F\u0915\u0943\u0924 \u0928\u094B\u0902\u0926. \u0938\u0927\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u0905\u0938\u0932\u0947\u0932\u094D\u092F\u093E \u0938\u094B\u0928\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u0926\u093E\u0917\u093F\u0928\u094D\u092F\u093E\u0935\u0930 BIS \u091A\u093F\u0928\u094D\u0939, \u0915\u0945\u0930\u0947\u091F \u0935 \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0905\u0902\u0915 (\u0909\u0926\u093E. 22K916) \u0906\u0923\u093F \u0938\u0939\u093E-\u0905\u0915\u094D\u0937\u0930\u0940/\u0905\u0902\u0915\u0940 HUID \u092A\u093E\u0939\u093E. \u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915\u093F\u0902\u0917 \u0910\u091A\u094D\u091B\u093F\u0915 \u0906\u0939\u0947; \u092A\u0923 \u0967 \u0938\u092A\u094D\u091F\u0947\u0902\u092C\u0930 \u0968\u0966\u0968\u096B \u092A\u093E\u0938\u0942\u0928 \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u0915\u0947\u0932\u0947\u0932\u094D\u092F\u093E \u091A\u093E\u0902\u0926\u0940\u091A\u094D\u092F\u093E \u0935\u0938\u094D\u0924\u0942\u0902\u0928\u093E HUID \u0906\u0935\u0936\u094D\u092F\u0915 \u0906\u0939\u0947. \u0916\u0930\u0947\u0926\u0940\u0935\u0947\u0933\u0940 \u091A\u093F\u0928\u094D\u0939\u0947, \u0936\u0941\u0926\u094D\u0927\u0924\u093E \u0906\u0923\u093F \u092C\u093F\u0932 \u0924\u092A\u093E\u0938\u093E.",en:"A BIS hallmark is an official record of tested purity. On a currently hallmarked gold article, look for the BIS mark, carat and fineness (such as 22K916), and a six-character HUID. Silver hallmarking is voluntary, but HUID is required on silver articles that are hallmarked from 1 September 2025. Check the marks, purity and invoice before purchase."}]},{title:{mr:"HUID \u092E\u094D\u0939\u0923\u091C\u0947 \u0915\u093E\u092F \u0906\u0923\u093F \u0915\u0938\u093E \u0924\u092A\u093E\u0938\u093E\u092F\u091A\u093E?",en:"What is HUID, and how do I check it?"},body:[{mr:"HUID \u0939\u093E \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u0915\u0947\u0932\u0947\u0932\u094D\u092F\u093E \u092A\u094D\u0930\u0924\u094D\u092F\u0947\u0915 \u0935\u0938\u094D\u0924\u0942\u0932\u093E \u0926\u093F\u0932\u0947\u0932\u093E \u0935\u0947\u0917\u0933\u093E \u0938\u0939\u093E \u0905\u0915\u094D\u0937\u0930\u0947/\u0905\u0902\u0915\u093E\u0902\u091A\u093E \u0915\u094D\u0930\u092E\u093E\u0902\u0915 \u0906\u0939\u0947. BIS Care \u0905\u0945\u092A\u092E\u0927\u094D\u092F\u0947 \u201CVerify HUID\u201D \u0928\u093F\u0935\u0921\u0942\u0928 \u0935\u0938\u094D\u0924\u0942\u0935\u0930\u0940\u0932 \u0915\u094D\u0930\u092E\u093E\u0902\u0915 \u091F\u093E\u0915\u093E. \u0905\u0945\u092A\u092E\u0927\u094D\u092F\u0947 \u0926\u093F\u0938\u0923\u093E\u0930\u093E \u0927\u093E\u0924\u0942, \u0936\u0941\u0926\u094D\u0927\u0924\u093E \u0906\u0923\u093F \u0935\u0938\u094D\u0924\u0942\u091A\u093E \u092A\u094D\u0930\u0915\u093E\u0930 \u0916\u0930\u0947\u0926\u0940\u0924\u0940\u0932 \u0935\u0938\u094D\u0924\u0942\u0936\u0940 \u091C\u0941\u0933\u0924\u094B \u0915\u093E \u092A\u093E\u0939\u093E. \u0915\u094D\u0930\u092E\u093E\u0902\u0915 \u091C\u0941\u0933\u0924 \u0928\u0938\u0947\u0932 \u0915\u093F\u0902\u0935\u093E \u092E\u093E\u0939\u093F\u0924\u0940 \u0935\u0947\u0917\u0933\u0940 \u0905\u0938\u0947\u0932, \u0924\u0930 \u0935\u093F\u0915\u094D\u0930\u0947\u0924\u094D\u092F\u093E\u0915\u0921\u0947 \u0938\u094D\u092A\u0937\u094D\u091F\u0940\u0915\u0930\u0923 \u092E\u093E\u0917\u093E.",en:"HUID is a unique six-character letter-and-number code for each hallmarked article. Enter the code on the article into \u201CVerify HUID\u201D in the BIS Care app. Check that the metal, purity and article type shown there match the item. If the code does not verify or the details differ, ask the seller to explain before buying."}]},{title:{mr:"GST \u0906\u0923\u093F \u0905\u0902\u0924\u093F\u092E \u0915\u093F\u0902\u092E\u0924",en:"GST and the final price"},body:[{mr:"\u0926\u093E\u0917\u093F\u0928\u094D\u092F\u093E\u091A\u093E \u0938\u094D\u0915\u094D\u0930\u0940\u0928\u0935\u0930\u0940\u0932 \u0927\u093E\u0924\u0942\u092D\u093E\u0935 \u092E\u094D\u0939\u0923\u091C\u0947 \u0905\u0902\u0924\u093F\u092E \u092C\u093F\u0932 \u0928\u093E\u0939\u0940. \u0926\u093E\u0917\u093F\u0928\u094D\u092F\u093E\u091A\u0947 \u0935\u091C\u0928, \u0918\u0921\u0923\u093E\u0935\u0933/\u0907\u0924\u0930 \u0932\u093E\u0917\u0942 \u0936\u0941\u0932\u094D\u0915 \u0906\u0923\u093F GST \u092F\u093E\u092E\u0941\u0933\u0947 \u0926\u0947\u092F \u0930\u0915\u094D\u0915\u092E \u092C\u0926\u0932\u0942 \u0936\u0915\u0924\u0947. \u0916\u0930\u0947\u0926\u0940\u092A\u0942\u0930\u094D\u0935\u0940 \u092A\u094D\u0930\u0924\u094D\u092F\u0947\u0915 \u0906\u0915\u093E\u0930\u0923\u0940 \u0906\u0923\u093F \u0905\u0902\u0924\u093F\u092E \u0930\u0915\u094D\u0915\u092E \u092C\u093F\u0932\u093E\u0935\u0930 \u0938\u094D\u092A\u0937\u094D\u091F \u0935\u093F\u091A\u093E\u0930\u0942\u0928 \u0918\u094D\u092F\u093E.",en:"The metal rate on screen is not the final bill for jewellery. The piece\u2019s weight, making charges or other applicable charges, and GST can change the amount due. Ask for a clear breakdown of every charge and the final bill before buying."}]},{title:{mr:"\u0935\u091C\u0928 \u0906\u0923\u093F \u092C\u093F\u0932",en:"Weight and the bill"},body:[{mr:"\u0921\u093F\u091D\u093E\u0907\u0928\u092E\u0927\u0940\u0932 \u0916\u0921\u0947 \u0915\u093F\u0902\u0935\u093E \u0907\u0924\u0930 \u092D\u093E\u0917 \u0905\u0938\u0924\u0940\u0932 \u0924\u0930 \u090F\u0915\u0942\u0923 \u0935\u091C\u0928 \u0906\u0923\u093F \u0938\u094B\u0928\u094D\u092F\u093E-\u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u0928\u093F\u0935\u094D\u0935\u0933 \u0935\u091C\u0928 \u0935\u0947\u0917\u0935\u0947\u0917\u0933\u0947 \u0938\u092E\u091C\u0942\u0928 \u0918\u094D\u092F\u093E. \u092C\u093F\u0932\u093E\u0935\u0930 \u0935\u0938\u094D\u0924\u0942\u091A\u0947 \u0935\u0930\u094D\u0923\u0928, \u0936\u0941\u0926\u094D\u0927\u0924\u093E \u0906\u0923\u093F \u0927\u093E\u0924\u0942\u091A\u0947 \u0928\u093F\u0935\u094D\u0935\u0933 \u0935\u091C\u0928 \u0924\u092A\u093E\u0938\u0942\u0928 \u092C\u093F\u0932 \u091C\u092A\u0942\u0928 \u0920\u0947\u0935\u093E. \u0926\u093E\u0917\u093F\u0928\u093E \u092C\u0926\u0932\u0924\u093E\u0928\u093E \u0915\u093F\u0902\u0935\u093E \u0935\u093F\u0915\u0924\u093E\u0928\u093E \u0935\u094D\u092F\u0935\u0939\u093E\u0930\u093E\u091A\u0947 \u0928\u093F\u092F\u092E \u0906\u0927\u0940 \u0935\u093F\u091A\u093E\u0930\u093E.",en:"If a design includes stones or other parts, distinguish the total weight from the net weight of gold or silver. Check the item description, purity and net metal weight on the bill, then keep the bill. Ask about the terms before exchanging or selling a piece."}]},{title:{mr:"\u0938\u094B\u0928\u0947-\u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u0926\u0930 \u0935\u093E\u091A\u0924\u093E\u0928\u093E",en:"Reading gold and silver rates"},body:[{mr:"\u0926\u0930 \u092A\u093E\u0939\u0924\u093E\u0928\u093E \u0927\u093E\u0924\u0942, \u0936\u0941\u0926\u094D\u0927\u0924\u093E, \u0935\u091C\u0928\u093E\u091A\u0947 \u090F\u0915\u0915 \u0906\u0923\u093F \u0905\u092A\u0921\u0947\u091F\u091A\u0940 \u0935\u0947\u0933 \u092A\u093E\u0939\u093E. \u0972\u092A\u0935\u0930\u0940\u0932 \u092E\u0939\u093E\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u093E\u0924\u0940\u0932 \u0926\u0930 \u0939\u0947 \u0926\u093E\u0917\u093F\u0928\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u0926\u0941\u0915\u093E\u0928\u093E\u0924\u0940\u0932 \u0905\u0902\u0924\u093F\u092E \u0935\u093F\u0915\u094D\u0930\u0940 \u0915\u093F\u0902\u092E\u0924 \u0938\u092E\u091C\u0942 \u0928\u0915\u093E; \u0926\u0941\u0915\u093E\u0928\u093E\u091A\u093E \u0939\u093F\u0936\u0947\u092C \u0906\u0923\u093F \u0915\u0930 \u0935\u0947\u0917\u0933\u0947 \u0905\u0938\u0942 \u0936\u0915\u0924\u093E\u0924. \u0926\u0930 \u0909\u092A\u0932\u092C\u094D\u0927 \u0928\u0938\u0947\u0932 \u0924\u0930 \u0905\u0902\u0926\u093E\u091C \u092C\u093E\u0902\u0927\u0923\u094D\u092F\u093E\u0910\u0935\u091C\u0940 \u092A\u0941\u0922\u0940\u0932 \u0916\u093E\u0924\u094D\u0930\u0940\u0936\u0940\u0930 \u0905\u092A\u0921\u0947\u091F\u091A\u0940 \u0935\u093E\u091F \u092A\u093E\u0939\u093E.",en:"When reading a rate, check the metal, purity, weight unit and update time. The Maharashtra rates in this app are not a jeweller\u2019s final selling price; the shop\u2019s charges and tax may differ. If a rate is unavailable, wait for the next verified update rather than guessing."}]},{title:{mr:"\u091A\u093E\u0902\u0926\u0940 999 \u0906\u0923\u093F 925 \u092E\u094D\u0939\u0923\u091C\u0947 \u0915\u093E\u092F?",en:"What do silver 999 and 925 mean?"},body:[{mr:"999 \u0939\u093E \u0939\u091C\u093E\u0930 \u092D\u093E\u0917\u093E\u0902\u092A\u0948\u0915\u0940 \u0915\u093F\u092E\u093E\u0928 999 \u092D\u093E\u0917 \u091A\u093E\u0902\u0926\u0940\u091A\u093E \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0926\u0930\u094D\u091C\u093E \u0906\u0939\u0947; 925 \u092E\u094D\u0939\u0923\u091C\u0947 \u0915\u093F\u092E\u093E\u0928 925 \u092D\u093E\u0917 \u091A\u093E\u0902\u0926\u0940. \u0926\u093E\u0917\u093F\u0928\u093E, \u0928\u093E\u0923\u0947 \u0915\u093F\u0902\u0935\u093E \u0935\u0938\u094D\u0924\u0942\u091A\u093E \u0926\u0930\u094D\u091C\u093E \u0935\u0947\u0917\u0933\u093E \u0905\u0938\u0942 \u0936\u0915\u0924\u094B. \u201C\u0938\u093F\u0932\u094D\u0935\u094D\u0939\u0930\u201D \u0905\u0938\u0947 \u0928\u093E\u0935 \u0915\u093F\u0902\u0935\u093E \u091A\u092E\u0915 \u092A\u093E\u0939\u0942\u0928 999 \u0936\u0941\u0926\u094D\u0927\u0924\u093E \u0917\u0943\u0939\u0940\u0924 \u0927\u0930\u0942 \u0928\u0915\u093E; \u0935\u0938\u094D\u0924\u0942\u0935\u0930\u0940\u0932 \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u0940 \u0928\u094B\u0902\u0926 \u0906\u0923\u093F \u092C\u093F\u0932 \u0924\u092A\u093E\u0938\u093E.",en:"999 is a silver fineness grade of at least 999 parts silver per 1,000; 925 means at least 925 parts. Jewellery, coins and other articles can have different grades. Do not assume an item is 999 just because it is described as \u201Csilver\u201D or looks bright. Check its fineness marking and invoice."}]},{title:{mr:"\u0972\u092A\u0935\u0930\u0940\u0932 \u091A\u093E\u0902\u0926\u0940\u091A\u093E \u0926\u0930 \u0915\u0938\u093E \u0935\u093E\u091A\u093E\u092F\u091A\u093E?",en:"How do I read the app\u2019s silver rate?"},body:[{mr:"\u092E\u0941\u0916\u094D\u092F \u0915\u093E\u0930\u094D\u0921\u0935\u0930 \u091A\u093E\u0902\u0926\u0940 999 \u091A\u093E \u0926\u0930 \u20B9/\u0915\u093F\u0932\u094B\u092E\u0927\u094D\u092F\u0947 \u0906\u0939\u0947. \u090F\u0915 \u0915\u093F\u0932\u094B \u092E\u094D\u0939\u0923\u091C\u0947 1,000 \u0917\u094D\u0930\u0945\u092E; \u0924\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u20B9/\u0917\u094D\u0930\u0945\u092E\u0938\u093E\u0920\u0940 \u0926\u093E\u0916\u0935\u0932\u0947\u0932\u093E \u0915\u093F\u0932\u094B\u091A\u093E \u0926\u0930 1,000 \u0928\u0947 \u092D\u093E\u0917\u093E. \u0926\u0930\u093E\u092C\u0930\u094B\u092C\u0930 \u0905\u092A\u0921\u0947\u091F\u091A\u0940 \u0935\u0947\u0933 \u092A\u093E\u0939\u093E. \u0939\u093E \u0927\u093E\u0924\u0942\u091A\u093E \u0938\u0902\u0926\u0930\u094D\u092D\u0926\u0930 \u0906\u0939\u0947, \u0926\u0941\u0915\u093E\u0928\u093E\u0924\u0940\u0932 \u0935\u0938\u094D\u0924\u0942\u091A\u0940 \u0905\u0902\u0924\u093F\u092E \u0915\u093F\u0902\u092E\u0924 \u0928\u093E\u0939\u0940; \u0935\u091C\u0928, \u0918\u0921\u0923\u093E\u0935\u0933 \u0915\u093F\u0902\u0935\u093E \u0907\u0924\u0930 \u0936\u0941\u0932\u094D\u0915 \u0906\u0923\u093F \u0915\u0930 \u0935\u0947\u0917\u0933\u0947 \u0905\u0938\u0942 \u0936\u0915\u0924\u093E\u0924.",en:"The main card shows a silver 999 rate in rupees per kilogram. One kilogram is 1,000 grams, so divide the displayed kilogram rate by 1,000 for a per-gram reference. Check the update time. This is a metal-rate reference, not a shop\u2019s final price for an article; weight, making or other charges and tax may be added."}]},{title:{mr:"\u091A\u093E\u0902\u0926\u0940 \u0916\u0930\u0947\u0926\u0940 \u0915\u0930\u0924\u093E\u0928\u093E \u0915\u093E\u092F \u0924\u092A\u093E\u0938\u093E\u0932?",en:"What should I check when buying silver?"},body:[{mr:"\u0935\u0938\u094D\u0924\u0942\u091A\u093E \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0905\u0902\u0915, \u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u0928\u093F\u0935\u094D\u0935\u0933 \u0935\u091C\u0928 \u0906\u0923\u093F \u092C\u093F\u0932\u093E\u0924\u0940\u0932 \u0924\u092A\u0936\u0940\u0932 \u091C\u0941\u0933\u0935\u093E. \u0935\u0938\u094D\u0924\u0942 BIS-\u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u0915\u0947\u0932\u0947\u0932\u0940 \u0905\u0938\u0932\u094D\u092F\u093E\u0938 BIS \u091A\u093F\u0928\u094D\u0939, \u201CSILVER\u201D, \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u093E \u0926\u0930\u094D\u091C\u093E \u0906\u0923\u093F HUID \u0924\u092A\u093E\u0938\u093E; BIS Care \u092E\u0927\u094D\u092F\u0947 HUID \u092A\u0921\u0924\u093E\u0933\u093E. \u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915\u093F\u0902\u0917 \u0910\u091A\u094D\u091B\u093F\u0915 \u0905\u0938\u0932\u094D\u092F\u093E\u0928\u0947 \u0939\u0949\u0932\u092E\u093E\u0930\u094D\u0915 \u0928\u0938\u0932\u0947\u0932\u0940 \u092A\u094D\u0930\u0924\u094D\u092F\u0947\u0915 \u0935\u0938\u094D\u0924\u0942 \u0928\u0915\u0932\u0940 \u0920\u0930\u0924 \u0928\u093E\u0939\u0940, \u092A\u0923 \u0936\u0941\u0926\u094D\u0927\u0924\u0947\u091A\u0940 \u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930 \u0916\u093E\u0924\u094D\u0930\u0940 \u0939\u0935\u0940 \u0905\u0938\u0932\u094D\u092F\u093E\u0938 BIS-\u092E\u093E\u0928\u094D\u092F\u0924\u093E\u092A\u094D\u0930\u093E\u092A\u094D\u0924 \u0915\u0947\u0902\u0926\u094D\u0930\u093E\u0924 \u0924\u092A\u093E\u0938\u0923\u0940\u0935\u093F\u0937\u092F\u0940 \u0935\u093F\u091A\u093E\u0930\u093E. \u0916\u0921\u0947, \u092E\u0923\u0940 \u0915\u093F\u0902\u0935\u093E \u0907\u0924\u0930 \u092D\u093E\u0917\u093E\u0902\u091A\u0947 \u0935\u091C\u0928 \u091A\u093E\u0902\u0926\u0940\u091A\u094D\u092F\u093E \u0928\u093F\u0935\u094D\u0935\u0933 \u0935\u091C\u0928\u093E\u0924 \u0927\u0930\u0932\u0947 \u0906\u0939\u0947 \u0915\u093E \u0924\u0947 \u0935\u093F\u091A\u093E\u0930\u093E.",en:"Match the fineness marking, net silver weight and invoice. If the article is BIS-hallmarked, look for the BIS mark, \u201CSILVER\u201D, the fineness grade and HUID; verify the code in BIS Care. Silver hallmarking is voluntary, so an unhallmarked item is not automatically fake, but ask about independent testing at a BIS-recognised centre if you need assurance. Ask whether stones, beads or other components are excluded from the net silver weight."}]}],Ad={mr:"\u0938\u094B\u0928\u093E\u0930 \u0915\u091F\u094D\u091F\u093E \u092F\u0947\u0925\u0947 \u092E\u0939\u093E\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u093E\u0924\u0940\u0932 \u0938\u094B\u0928\u0947 \u0906\u0923\u093F \u091A\u093E\u0902\u0926\u0940\u091A\u0947 \u0926\u0930, \u0924\u0938\u0947\u091A \u0916\u0930\u0947\u0926\u0940\u092C\u0926\u094D\u0926\u0932 \u0938\u094B\u092A\u0940 \u092E\u093E\u0939\u093F\u0924\u0940 \u092E\u0930\u093E\u0920\u0940\u0924 \u092E\u093F\u0933\u0924\u0947. \u0926\u0930\u093E\u0902\u0935\u0930 GST \u0905\u0924\u093F\u0930\u093F\u0915\u094D\u0924 \u0932\u093E\u0917\u0942 \u0939\u094B\u0924\u094B. \u0916\u0930\u0947\u0926\u0940\u092A\u0942\u0930\u094D\u0935\u0940 \u0924\u0941\u092E\u091A\u094D\u092F\u093E \u0935\u093F\u0915\u094D\u0930\u0947\u0924\u094D\u092F\u093
