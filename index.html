<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="सोनार कट्टा"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./3-icon-original-512.png"><link rel="apple-touch-icon" href="./3-icon-original-512.png"><title>सोनार कट्टा - आजचे दर</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e0b url('./1-card-template.png') center bottom / 100% auto no-repeat}body{font-family:system-ui,'Noto Sans Devanagari',sans-serif}main{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;left:0;overflow:hidden;background:#100e0b url('./1-card-template.png') center bottom / 100% auto no-repeat}canvas{display:block;width:100%;height:100%}nav{position:absolute;left:9.6%;right:9.6%;top:91.2%;height:3.4%;display:flex;gap:1.2%}nav a{flex:1;display:block;text-indent:-9999px;overflow:hidden;border-radius:12px}nav a:focus-visible{outline:3px solid #fff;outline-offset:2px}.sr-only{position:absolute;left:-9999px}
</style></head><body><main><canvas id="card" width="941" height="1672" role="img" aria-label="सोनार कट्टा: सोने व चांदीचे दर"></canvas><nav aria-label="आम्हाला फॉलो करा"><a href="https://www.youtube.com/@sonarkatta" target="_blank" rel="noopener noreferrer" aria-label="YouTube">YouTube</a><a href="https://www.instagram.com/sonarkatta/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">Instagram</a><a href="https://www.facebook.com/SonarKatta/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">Facebook</a></nav><div class="sr-only" id="description" role="status"></div></main><script>
(()=>{
const c=document.getElementById('card'),ctx=c.getContext('2d'),status=document.getElementById('description');
const bg=new Image();bg.src='./1-card-template.png';const logo=new Image();logo.src='./2-brand-original.png';
const fields=['gold24_10g','gold22_10g','gold18_10g','silver999_kg'];const titles=['सोने २४ कॅरेट','सोने २२ कॅरेट','सोने १८ कॅरेट','चांदी ९९९'];
const W=941,H=1672,center=470;let best=null;
// Rebuild the bitmap at physical display resolution, while retaining the
// approved card's 941x1672 drawing coordinates and aligned social hit regions.
function sizeCanvas(){const box=c.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,4),w=Math.round(box.width*ratio),h=Math.round(box.height*ratio);if(w&&h&&(c.width!==w||c.height!==h)){c.width=w;c.height=h;ctx.setTransform(w/W,0,0,h/H,0,0);draw(best)}}
new ResizeObserver(sizeCanvas).observe(c);addEventListener('resize',sizeCanvas);
function valid(d){if(!d||!fields.every(k=>Number.isInteger(d[k])&&d[k]>0))return false;const t=new Date(d.quote_timestamp),age=Date.now()-t;return Number.isFinite(t.valueOf())&&age>=-300000&&age<=21600000&&Math.abs(d.gold22_10g/d.gold24_10g-.916)<=.004&&Math.abs(d.gold18_10g/d.gold24_10g-.75)<=.004}
function line(text,x,y,size,color,weight=700,latin=false){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.shadowColor='#0009';ctx.shadowBlur=5;ctx.font=`${weight} ${size}px ${latin?'system-ui':'"Noto Sans Devanagari",system-ui'}`;ctx.fillText(text,x,y);ctx.restore()}
function draw(data){if(!bg.complete||!bg.naturalWidth)return;ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0,W,H);
// Exact owner logo is drawn as a separate asset so replacement does not redraw the card.
if(logo.complete&&logo.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(470,143,100,0,Math.PI*2);ctx.clip();ctx.drawImage(logo,370,43,200,200);ctx.restore()}
if(!valid(data)){ctx.fillStyle='#130c08e8';ctx.fillRect(277,470,465,560);line('दर तात्पुरते उपलब्ध नाहीत',center,685,35,'#f2bc64');line('कृपया नंतर पुन्हा तपासा',center,765,28,'#fff3df');status.textContent='पडताळलेले दर सध्या उपलब्ध नाहीत';return}
const time=new Date(data.quote_timestamp),dateparts=new Intl.DateTimeFormat('mr-IN-u-nu-deva',{timeZone:'Asia/Kolkata',day:'numeric',month:'long',year:'numeric'}).formatToParts(time);const date=['day','month','year'].map(k=>dateparts.find(p=>p.type===k)?.value||'').join(' ');
line(date+'  |  महाराष्ट्र',center,269,32,'#f8e4bf',750);
const ys=[359,610,853,1089],unitYs=[417,668,911,1147],valueYs=[478,729,972,1208];
for(let i=0;i<4;i++){line(titles[i],center,ys[i],43,'#f2bd68',800);line(i===3?'१ किलो':'१० ग्रॅम',center,unitYs[i],25,'#fff7e7',650);line('₹'+new Intl.NumberFormat('en-IN').format(data[fields[i]]),525,valueYs[i],62,'#fffaf0',850,true)}
const tt=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false}).format(time);
line('अपडेट: '+tt+' IST',center,1268,23,'#fff0cc',650);status.textContent=`${date}: ${titles.map((t,i)=>t+' '+data[fields[i]]).join(', ')}. अपडेट ${tt} IST.`}
async function refresh(){let candidate=null;for(const url of ['https://raw.githubusercontent.com/sonarkatta/sonarkatta.github.io/main/1-rates.json','./1-rates.json']){try{const r=await fetch(url+'?ts='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(6500)});if(r.ok){const d=await r.json();if(valid(d)&&(!candidate||new Date(d.quote_timestamp)>new Date(candidate.quote_timestamp)))candidate=d}}catch(_){}}best=candidate;draw(best)}
sizeCanvas();Promise.all([bg.decode(),logo.decode().catch(()=>{}),document.fonts.ready]).then(()=>{draw(null);refresh()});setInterval(refresh,60000);addEventListener('online',refresh);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();</script></body></html>
