:root{font-family:Noto,system-ui,sans-serif}*{box-sizing:border-box}
html,body,#root{margin:0;background:#d5c8ae} .file-card{padding:0!important;background:transparent!important;border-radius:0!important;box-shadow:none!important;max-width:none!important}
.liquid-stage{--ink:#213039;position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse at 85% 8%,#ffffff 0%,transparent 32%),radial-gradient(ellipse at 10% 70%,#719ba7b8 0%,transparent 39%),linear-gradient(151deg,#f6e4c2 0%,#d7e5e5 20%,#b9cbd5 38%,#e1c897 60%,#b2d4cf 77%,#eddec5 100%)}
.atmosphere{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.atmosphere:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(112deg,transparent 0 35px,#fff9 47px,#bd95594d 51px,transparent 69px,transparent 165px);opacity:.35}.atmosphere i{position:absolute;border-radius:50%;filter:blur(20px)}.atmosphere i:nth-child(1){width:250px;height:220px;top:40px;right:-120px;background:#f5cf88a8}.atmosphere i:nth-child(2){width:270px;height:320px;left:-130px;top:39%;background:#76b5c1a6}.atmosphere i:nth-child(3){width:330px;height:270px;right:-130px;bottom:-50px;background:#f5dfb3c9}
.glass{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(137deg,#ffffff8a 0%,#eff8fd4c 27%,#ffffff70 47%,#f9e8c651 67%,#fff9 100%);border:1px solid #fffdfad9;backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 2px 2px #fff,inset 1px 0 1px #ffffffc7,inset 0 -2px 5px #8eaca465,0 5px 14px #405c6554,0 0 12px #ffffff72}
.glass:before{content:'';position:absolute;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 5%,#fff3 18%,#fff9 24%,transparent 37%,transparent 57%,#fffc 63%,transparent 77%);opacity:.8;transform:translateX(-12%)}.glass:after{content:'';position:absolute;inset:2px;pointer-events:none;border-radius:inherit;border-top:1px solid #fffef9b5;border-left:1px solid #ffffff67;mask-image:linear-gradient(140deg,#000,transparent 68%)}
button,a{font:inherit;cursor:pointer}.round{width:44px;height:44px;border-radius:50%;font:500 26px/1 Noto,system-ui;color:#23313b;display:grid;place-items:center}.top-controls{position:absolute;z-index:5;top:13px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.top-controls button{pointer-events:auto}.top-controls .refresh{font-size:24px}
.screen{max-width:500px;margin:auto;padding:10px 12px 16px;min-height:100dvh;display:flex;flex-direction:column;gap:8px}.mast{min-height:94px;border-radius:28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 50px;box-shadow:inset 0 2px 2px #fff,0 6px 15px #677b8342}.mast img{height:64px;max-width:90px;object-fit:contain;filter:drop-shadow(0 2px 3px #72634c55)}.mast span{font-size:9px;font-weight:700;letter-spacing:.02em}.preview-note{padding:7px 10px;border-radius:13px;text-align:center;font-size:10px;font-weight:700;color:#354b50}.rates{display:grid;grid-template-columns:1fr;gap:8px;flex:1;align-content:center}.rate{min-height:100px;border-radius:28px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;padding:8px 12px;gap:8px}.rate .bar-well{height:73px;width:72px;display:grid;place-items:center;border-radius:22px;background:radial-gradient(ellipse,#fffbbdcc 0%,#ffffff30 54%,transparent 72%);filter:drop-shadow(0 3px 4px #6b5e5066)}.bar-well img{width:72px;height:70px;object-fit:contain}.rate-label{display:flex;flex-direction:column;min-width:0;white-space:nowrap}.rate-label strong{font-size:15px;font-weight:800}.rate-label small{font-size:10px;color:#465e65}.number{font:800 19px/1.15 Noto,system-ui,sans-serif;white-space:nowrap;letter-spacing:-.04em;color:#122633;text-shadow:0 1px #fff}
.bottom{border-radius:18px;text-align:center;padding:8px 10px;display:flex;flex-direction:column;font-size:10px}.bottom small{font-size:9px;color:#455d61}.social{display:flex;gap:4px}.social a,.menu-social a{flex:1;text-align:center;text-decoration:none;color:#293c42;font-size:10px;font-weight:800;padding:9px 2px;border-radius:13px;white-space:nowrap}.copyright{text-align:center;font-size:8px;color:#3b4d52}.toast{position:fixed;z-index:20;top:63px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:20px;white-space:nowrap;font-size:11px}
.overlay{position:absolute;z-index:8;inset:0;min-height:100dvh;padding:12px 14px 22px;overflow-y:auto;background:linear-gradient(152deg,#c6d7dbc9,#e8d7b3bd 42%,#a5c8c7d4);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}.overlay-shape{position:absolute;z-index:-1;top:20%;left:-90px;width:360px;height:360px;background:radial-gradient(ellipse,#fff7c8c6,transparent 70%);filter:blur(20px)}.top-controls:has(+ .screen + .overlay){z-index:0;visibility:hidden}.overlay-head{min-height:64px;padding:10px 14px 10px 18px;border-radius:24px;display:flex;align-items:center;justify-content:space-between;font-size:23px;font-weight:800}.overlay-head .close{width:40px;height:40px;font-size:27px}.language{border-radius:28px;padding:4px 8px;margin:16px 0 12px auto;width:max-content;display:flex;align-items:center;gap:6px}.language button{border:0;background:transparent;color:#53636b;padding:4px;font-size:12px}.language button[aria-pressed=true]{color:#1a303a;font-weight:900}.menu-list{display:grid;gap:10px}.menu-item{border-radius:21px;min-height:68px;width:100%;display:flex;align-items:center;padding:10px 16px;gap:14px;text-align:left;color:#21313a}.menu-item strong{flex:1;font-size:16px}.menu-icon{color:#946735;font-size:24px}.menu-item>span:last-child{font-size:25px;color:#a77f49}.menu-social{display:flex;gap:5px;margin-top:16px}.menu-foot{display:block;text-align:center;margin-top:16px;font-size:9px}.back{border-radius:14px;padding:8px 16px;color:#233944;margin:14px 0}.section-cards{display:grid;gap:12px}.section-card{border-radius:22px;padding:20px 16px;min-height:95px;display:flex;gap:15px;align-items:center}.section-card span{font-size:24px;color:#9a7544}.section-card strong{font-size:16px;line-height:1.4}
